<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miso Messenger</title>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="/static/script.js" defer></script>
</head>

<body>

    <div id="app">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h2>Chats</h2>
                <div class="sidebar-actions">
                    <button onclick="openGroupModal()" title="Department Broadcast">📢</button>
                    <button onclick="openAddContact()" title="New Contact">➕</button>
                </div>
            </div>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search contacts...">
            </div>
            <div class="contact-list" id="contact-list">
                <!-- Contacts injected here -->
            </div>
        </div>

        <!-- Main Chat Area -->
        <div class="chat-area">
            <!-- Placeholder View -->
            <!-- Placeholder View (Now Quick Send) -->
            <div class="chat-placeholder" id="chat-placeholder">
                <div style="width: 100%; max-width: 400px; padding: 20px; text-align: center;">
                    <h3 style="margin-bottom: 20px; color: #333;">Quick Message</h3>

                    <div class="form-group">
                        <input type="text" id="quick-phone" placeholder="Enter Mobile Number"
                            style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; margin-bottom: 10px;">
                    </div>

                    <div class="form-group">
                        <textarea id="quick-message" placeholder="Type a message..."
                            style="width: 100%; height: 100px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; resize: none; margin-bottom: 15px;"></textarea>
                    </div>

                    <button onclick="sendDirectMessage()"
                        style="width: 100%; padding: 12px; background: #0084ff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer;">
                        Send Now
                    </button>
                </div>
            </div>

            <!-- Active Chat Interface -->
            <div id="chat-interface" style="display: none; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <div class="chat-header-info">
                        <h3 id="chat-name">Select Contact</h3>
                        <span id="chat-details">...</span>
                    </div>
                </div>

                <div class="messages-container" id="messages-container">
                    <!-- Messages injected here -->
                </div>

                <div class="input-area">
                    <textarea id="message-input" placeholder="Type a message..."></textarea>
                    <button class="send-btn" id="send-btn">
                        <svg viewBox="0 0 24 24">
                            <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Add Contact Modal -->
    <div class="modal" id="contact-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Add New Contact</h3>
                <span class="close-modal" onclick="closeAddContact()">&times;</span>
            </div>
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="new-name" placeholder="John Doe">
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="text" id="new-phone" placeholder="+639...">
            </div>
            <div class="form-group">
                <label>Department</label>
                <select id="new-dept">
                    <option value="IT">IT</option>
                    <option value="HR">HR</option>
                    <option value="Finance">Finance</option>
                    <option value="Operations">Operations</option>
                </select>
            </div>
            <button class="form-btn" onclick="saveContact()">Save Contact</button>
        </div>
    </div>

    <!-- Group Message Modal -->
    <div class="modal" id="group-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Department Broadcast</h3>
                <span class="close-modal" onclick="closeGroupModal()">&times;</span>
            </div>
            <div class="form-group">
                <label>Select Department</label>
                <select id="group-dept">
                    <option value="IT">IT</option>
                    <option value="HR">HR</option>
                    <option value="Finance">Finance</option>
                    <option value="Operations">Operations</option>
                </select>
            </div>
            <div class="form-group">
                <label>Message</label>
                <textarea id="group-msg"
                    style="width:100%; height:80px; padding:10px; border-radius:6px; border:1px solid #ddd;"></textarea>
            </div>
            <button class="form-btn" onclick="sendGroup()">Send Broadcast</button>
        </div>
    </div>

</body>

</html>
